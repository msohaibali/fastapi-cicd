name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
    
    - name: Verify Directory
      run: |
          echo "Current directory:"
          pwd
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la
    
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag cicd-app:$(date +%s)
