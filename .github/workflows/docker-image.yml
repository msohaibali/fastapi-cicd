name: Docker Image CI

on:
  pull_request:
    branches: [ "main" ]

  schedule:
    - cron: 2 * * * *

jobs:

  build:

    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Print Sohaib
      run: echo "Sohaib"
    
    - name: Verify Directory
      run: |
          echo "Current directory:"
          pwd
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la
    
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag cicd-app:$(date +%s)
