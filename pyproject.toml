[project]
name = "fastapi-cicd-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bandit>=1.9.4",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 90
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pytest.coverage.paths]
source = ["app"]

[tool.pytest.coverage.run]
branch = true
omit = ["tests/*"]